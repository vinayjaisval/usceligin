<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-group { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; }
        input { padding: 8px; width: 300px; border: 1px solid #ccc; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; border: 1px solid #ddd; background: #f9f9f9; }
        .error { border-color: #dc3545; background: #f8d7da; }
        .success { border-color: #28a745; background: #d4edda; }
    </style>
</head>
<body>
    <h1>OTP Debug Test</h1>
    <p>This page will help us debug the OTP sending functionality.</p>

    <form id="otpForm">
        <div class="form-group">
            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" name="phone" placeholder="+1234567890">
        </div>

        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="test@example.com">
        </div>

        <button type="submit">Send OTP</button>
    </form>

    <div id="result" class="result" style="display: none;"></div>

    <script>
        // Get CSRF token from Laravel
        let csrfToken = '';

        // Try to get CSRF token from the main app
        fetch('/usceligin/csrf-token')
            .then(response => response.json())
            .then(data => {
                csrfToken = data.token;
                console.log('CSRF Token obtained:', csrfToken);
            })
            .catch(error => {
                console.error('Failed to get CSRF token:', error);
                document.getElementById('result').innerHTML =
                    '<strong>Warning:</strong> Could not get CSRF token. Testing without it.';
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').className = 'result error';
            });

        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const phone = document.getElementById('phone').value;
            const email = document.getElementById('email').value;
            const resultDiv = document.getElementById('result');

            // Validate input
            if (!phone && !email) {
                resultDiv.innerHTML = '<strong>Error:</strong> Please enter either phone number or email address.';
                resultDiv.className = 'result error';
                resultDiv.style.display = 'block';
                return;
            }

            const formData = new FormData();
            if (phone) formData.append('phone', phone);
            if (email) formData.append('email', email);
            if (csrfToken) formData.append('_token', csrfToken);

            resultDiv.innerHTML = 'Sending OTP request...';
            resultDiv.className = 'result';
            resultDiv.style.display = 'block';

            try {
                const response = await fetch('/usceligin/otp/send', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'Accept': 'application/json'
                    }
                });

                const responseText = await response.text();
                console.log('Raw response:', responseText);

                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (parseError) {
                    console.error('JSON parse error:', parseError);
                    resultDiv.innerHTML = `
                        <strong>Response Parse Error:</strong><br>
                        Status: ${response.status}<br>
                        Response: <pre>${responseText}</pre>
                    `;
                    resultDiv.className = 'result error';
                    return;
                }

                if (response.ok && data.success) {
                    resultDiv.innerHTML = `
                        <strong>SUCCESS:</strong><br>
                        Message: ${data.message || 'OTP sent successfully!'}
                    `;
                    resultDiv.className = 'result success';
                } else {
                    resultDiv.innerHTML = `
                        <strong>ERROR:</strong><br>
                        Status: ${response.status}<br>
                        Message: ${data.message || 'Unknown error'}<br>
                        ${data.errors ? 'Validation Errors: ' + JSON.stringify(data.errors) : ''}
                    `;
                    resultDiv.className = 'result error';
                }

            } catch (error) {
                console.error('Request failed:', error);
                resultDiv.innerHTML = `
                    <strong>Network Error:</strong><br>
                    ${error.message}
                `;
                resultDiv.className = 'result error';
            }
        });
    </script>
</body>
</html>
